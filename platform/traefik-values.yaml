# Traefik: the cluster's HTTPS front door (chart traefik/traefik 41.6.1, Traefik v3.7).
# ingress-nginx was retired by the Kubernetes project in 2026, so StreamFlix uses Traefik.
deployment:
  replicas: 3 # one per availability zone (see topologySpreadConstraints)

# With externalTrafficPolicy Local, a load balancer IP only works if its zone runs a Traefik
# pod. Spread pods across zones, and let the NLB cross zones as a backup.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true # Ingress status shows the load balancer address
  kubernetesCRD:
    enabled: true # needed for the https-redirect Middleware

# HTTP→HTTPS redirection is applied per app Ingress (a Middleware), not globally, so the
# Let's Encrypt HTTP-01 challenge stays reachable over plain HTTP.

service:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
  spec:
    type: LoadBalancer
    # Keep the visitor's real IP (no SNAT), so rate limiting works per visitor.
    externalTrafficPolicy: Local

resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { memory: 256Mi }

podDisruptionBudget:
  enabled: true
  minAvailable: 1
