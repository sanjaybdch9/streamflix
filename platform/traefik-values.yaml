# Traefik: the cluster's HTTPS front door (chart traefik/traefik 41.6.1, Traefik v3.7).
# ingress-nginx was retired by the Kubernetes project in 2026, so StreamFlix uses Traefik.
deployment:
  replicas: 2

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true # Ingress status shows the load balancer address
  kubernetesCRD:
    enabled: true # needed for the https-redirect Middleware

# HTTP→HTTPS redirection is applied per app Ingress (a Middleware), not globally, so the
# Let's Encrypt HTTP-01 challenge stays reachable over plain HTTP.

service:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  spec:
    type: LoadBalancer
    # Keep the visitor's real IP (no SNAT), so rate limiting works per visitor.
    externalTrafficPolicy: Local

resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { memory: 256Mi }

podDisruptionBudget:
  enabled: true
  minAvailable: 1
