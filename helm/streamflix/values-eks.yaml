# AWS EKS overrides. The pipeline also sets global.imageRegistry and global.imageTag.
frontend:
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }

# Public HTTPS entry point through Traefik, with a free Let's Encrypt certificate
# (cluster add-ons in platform/, installed by the Platform workflow).
ingress:
  enabled: true
  className: traefik
  host: streamflixer.duckdns.org
  clusterIssuer: letsencrypt
  traefikHttpsRedirect: true

global:
  imagePullPolicy: Always

storageClass:
  create: true

postgresql:
  storageClass: gp3
  storage: 20Gi

monitoring:
  serviceMonitor:
    enabled: true
  grafanaDashboard:
    enabled: true
