# AWS EKS overrides. The pipeline also sets global.imageRegistry and global.imageTag.
frontend:
  service:
    # Internal only: visitors enter through Traefik (HTTPS), which routes to this service.
    type: ClusterIP
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }

# Public HTTPS entry point through Traefik, with a free Let's Encrypt certificate
# (cluster add-ons in platform/, installed by the Platform workflow).
ingress:
  enabled: true
  className: traefik
  host: streamflixer.duckdns.org
  clusterIssuer: letsencrypt
  traefikHttpsRedirect: true

services:
  api-gateway:
    env:
      # Visitor → Traefik → frontend nginx → gateway: two proxies to trust, so rate limiting
      # sees each visitor's real IP (Traefik drops X-Forwarded-For sent by clients).
      TRUST_PROXY_HOPS: "2"

global:
  imagePullPolicy: Always

storageClass:
  create: true

postgresql:
  storageClass: gp3
  storage: 20Gi

monitoring:
  serviceMonitor:
    enabled: true
  grafanaDashboard:
    enabled: true
