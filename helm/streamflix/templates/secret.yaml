{{- if not .Values.secrets.existingSecret }}
{{- /* Reuse existing values on upgrade so tokens stay valid and Postgres keeps its password. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "streamflix-secrets" }}
apiVersion: v1
kind: Secret
metadata:
  name: streamflix-secrets
  labels:
    {{- include "streamflix.labels" . | nindent 4 }}
  annotations:
    # Keep the secret if the release is uninstalled: the database volume still depends on it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  JWT_SECRET: {{ index $existing.data "JWT_SECRET" }}
  PLAYBACK_SECRET: {{ index $existing.data "PLAYBACK_SECRET" }}
  POSTGRES_PASSWORD: {{ index $existing.data "POSTGRES_PASSWORD" }}
  {{- else }}
  JWT_SECRET: {{ randAlphaNum 48 | b64enc }}
  PLAYBACK_SECRET: {{ randAlphaNum 48 | b64enc }}
  POSTGRES_PASSWORD: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
